#### 
# To make your print_start macro work you need to put a bit of code in your slicer too. Put this in the: Start G-code in SS at printer settings and then Custom G-code. Put in the code down below there.
#
#    PRINT_START EXTRUDER_TEMP={first_layer_temperature[initial_extruder] + extruder_temperature_offset[initial_extruder]} BED_TEMP=[first_layer_bed_temperature]
####
#    In your End G-code you simply put:
#    print_end    ;end script from macro
####

[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - PLEASE CUSTOMISE THE SCRIPT
gcode:
    {% set BED = params.BED|default(70)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(190)|float %}

    # # Start bed heating
    # M140 S{BED}
    # # Wait for bed to reach temperature
    # M190 S{BED}

    # M117 Homing...                 ; display message
    # G28 Y0 X0 Z0

    # Z_TILT_ADJUST

    # BED_MESH_CALIBRATE

    # # Set and wait for nozzle to reach temperature
    # M109 S{EXTRUDER}
    
    # #Purge Line Gcode
    # G92 E0
    # G90
    # G0 X0 Y-4 F6000
    # G0 Z0.4
    # G91
    # G1 X120 E30 F1200
    # G1 Y1
    # G1 X-120 E30 F1200
    # G92 E0
    # G90
    
    # G1 Z15.0 F600 ;move the platform down 15mm
    # G1 X125 Y125 F3000
    # G92 E0 ;zero the extruded length again
    # G1 F9000
    # M117 Printing...

    G90 ; use absolute coordinates
    M83 ; extruder relative mode
    M104 S{EXTRUDER} ; set extruder temp
    M140 S{BED} ; set bed temp
    M190 S{BED} ; wait for bed temp
    M109 S{EXTRUDER} ; wait for extruder temp
    G28 Y0 X0 Z0 ; home all without mesh bed level
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
    # G1 Z0.2 F6000
    # G1 Y-3 F1000 ; go outside print area
    # G92 E0
    # G1 X60 E9 F1000 ; intro line
    # G1 X100 E12.5 F1000 ; intro line
    # G92 E0


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script
gcode:
    #   Get Boundaries
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    #   Check end position to determine safe directions to move
    {% if printer.toolhead.position.x < (max_x - 20) %}
        {% set x_safe = 20.0 %}
    {% else %}
        {% set x_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.y < (max_y - 20) %}
        {% set y_safe = 20.0 %}
    {% else %}
        {% set y_safe = -20.0 %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 1) %}
        {% set z_init_safe = 1.0 %}
    {% else %}
        {% set z_init_safe = max_z - printer.toolhead.position.z %}
    {% endif %}

    {% if printer.toolhead.position.z < (max_z - 20) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - printer.toolhead.position.z %}
    {% endif %}
    
    #  Commence PRINT_END
    M400                             ; wait for buffer to clear
    G92 E0                           ; zero the extruder
    G1 E-4.0 F3600                   ; retract
    G91                              ; relative positioning
    G0 Z{z_safe} F3600               ; move nozzle up
    G0 X{x_safe} Y{y_safe} F20000    ; move nozzle to remove stringing
    
    M104 S0                          ; turn off hotend
    M140 S0                          ; turn off bed
    M106 S0                          ; turn off fan
    G90                              ; absolute positioning
    G0 X{max_x / 2} Y{max_y} F3600   ; park nozzle at rear
    M117 Finished!
    
    # G1 Z{z_init_safe} F720 ; Move print head up
    # G1 X0 Y200 F6000 ; park
    # G1 Z{z_safe} F720 ; Move print head further up
    # G4 ; wait
    # M221 S100 ; reset flow
    # M104 S0 ; turn off temperature
    # M140 S0 ; turn off heatbed
    # M107 ; turn off fan
    # M84 ; disable motors