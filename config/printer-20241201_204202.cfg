# This file contains common pin mappings for the Duet3 6HC. To use
# this config, the firmware should be compiled for the SAME70Q20B.

# To flash the board, erase the existing firmware by jumpering the erase jumper.
# Boot the board, wait for reset to complete, remove the jumper, and then reboot the board,
# as described in Duet's documentation:
#    https://docs.duet3d.com/en/User_manual/RepRapFirmware/Updating_firmware#all-other-duet-boards
# Then run: make flash FLASH_DEVICE=/dev/ttyACM0

# See docs/Config_Reference.md for a description of parameters.


# Pins for reference, v1.02 board:
# Driver Step Pins - 0:PC18 1:PC16 2:PC28 3:PC1  4:PC4 5:PC9
# Driver Dir Pins  - 0:PB5  1:PD10 2:PA4  3:PA22 4:PC3 5:PD14
# Driver Enable - !PA9
# Driver CS - PD17
# Thermistor Pins - TEMP0:PC15 TEMP1:PC29 TEMP2:PC30 TEMP3:PC31
# Pullup Resistor - 2200
# Vssa Sense:PC13 | Vref Sense:PC0
# Current Sense resistor for drivers - 0.05ohm
# SPI lines:{PC25} -> SPIMosi:PC27 SPIMiso:PC26 SPISCLK:PC24
# Vin Monitor:PA20
# CAN Pins - TX0:PB2 RX0:PB3 TX1:PD12 RX1:PC12
# Heaters - Out0:PA7 Out1:PA24 Out2:PA16 Out3:PA11
# Fan outputs - Out4:PA15 Out5:PC5 Out6:PA8 Out7:PC11 Out8:PC8 Out9:PA12 | Out9 is shared with VFD_Out
# Tach Pins for Fans - Out4.Tach:PC7 Out5.Tach:PD23 Out6.Tach:PA1
# GPIO_out - IO0:PD26 IO1:PD16 IO2:PD27 IO3:PA3 IO4:PE0  IO5:PD21 IO6:PA0  IO7:PD23 IO8:PE1
# GPIO_in -  IO0:PD25 IO1:PD15 IO2:PD28 IO3:PE5 IO4:PD30 IO5:PA19 IO6:PA18 IO7:PA17 IO8:PE3
# Driver Diag - 0:PD29 1:PC17 2:PD13 3:PC2 4:PD31 5:PC10
[include mainsail.cfg]
[include exclude_object.cfg]
[include start_stop.cfg]
[include macro.cfg]
[include speed.cfg]
[include KAMP_Settings.cfg]
[display_status]
[exclude_object]
[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
recover_velocity: 350

#############################
#
# Parrot 3D
#
#############################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_same70q20b_00313853315238323031303132303535-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor duet3_m6hc]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    100, 100, 20  # an example

[printer]
kinematics: cartesian
max_velocity: 2500
max_accel: 7000
max_z_velocity: 20
max_z_accel: 1500

#############################
#
# Stepper
#
#############################

[autotune_tmc stepper_x]
motor: ldo-42sth40-1004a
[autotune_tmc stepper_y]
motor: ldo-42sth40-1004a

[autotune_tmc stepper_z]
motor: ldo-42sth34-1004l321e
[autotune_tmc stepper_z1]
motor: ldo-42sth34-1004l321e

[autotune_tmc extruder]
motor: bondtech-42H025H-0704A-005

[stepper_x]
#driver 0
step_pin: PC18
dir_pin: !PB5
enable_pin: !PA9
microsteps: 128
rotation_distance: 32
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_endstop: 0
position_max: 255
homing_speed: 30
homing_retract_dist: 0

[tmc5160 stepper_x]
cs_pin: PD17
diag0_pin: !PD29
spi_bus: usart1
chain_position: 1
chain_length: 6
interpolate: true
run_current: 0.5
sense_resistor: 0.05
stealthchop_threshold: 999999
# -64 is most sensitive value, 63 is least sensitive
driver_SGT: -1

[stepper_y]
#driver 1
step_pin: PC16
dir_pin: !PD10
enable_pin: !PA9
microsteps: 128
rotation_distance: 32
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: -4
position_max: 212.5
position_min: -4
homing_speed: 30
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: PD17
diag0_pin: !PC17
chain_position: 2
chain_length: 6
interpolate: true
run_current: 0.5
sense_resistor: 0.05
stealthchop_threshold: 999999
# -64 is most sensitive value, 63 is least sensitive
driver_SGT: -1

[stepper_z]
#driver2
step_pin: PC28
dir_pin: PA4
enable_pin: !PA9
microsteps: 128
rotation_distance: 8
full_steps_per_rotation: 200  
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 235
homing_speed: 10

[tmc5160 stepper_z]
cs_pin: PD17
diag0_pin: PD13
chain_position: 3
chain_length: 6
interpolate: true
run_current: 0.4
sense_resistor: 0.05
stealthchop_threshold: 999999

[stepper_z1]
#driver3
step_pin: PC1
dir_pin: PA22
enable_pin: !PA9
microsteps: 128
rotation_distance: 8

[tmc5160 stepper_z1]
cs_pin: PD17
diag0_pin: PC2
chain_position: 4
chain_length: 6
interpolate: true
run_current: 0.4
sense_resistor: 0.05
stealthchop_threshold: 999999

[adc_scaled vref_scaled]
vref_pin: PC0
vssa_pin: PC13

#############################
#
# Extruder
#
#############################
[extruder]
#driver4
step_pin: PC4
dir_pin: PC3
enable_pin: !PA9
microsteps: 128
rotation_distance: 8
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA16 #Out2
sensor_type: ATC Semitec 104GT-2
pullup_resistor: 2200
sensor_pin: vref_scaled:PC29 #Temp1
#control: pid
#pid_Kp: 30.089
#pid_Ki: 2.229
#pid_Kd: 101.550
min_temp: 0
max_temp: 300
max_extrude_only_distance: 1000.0
max_extrude_cross_section: 500
max_extrude_only_velocity: 200
max_extrude_only_accel: 10000
pressure_advance: 0.05
# pressure_advance_smooth_time: 0.040000

[tmc5160 extruder]
cs_pin: PD17
chain_position: 5
chain_length: 6
interpolate: true
run_current: 0.6
sense_resistor: 0.05
stealthchop_threshold: 999999

[verify_heater extruder]
max_error: 480

# Support for gcode arc (G2/G3) commands.
[gcode_arcs]
#resolution: 1.0
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.


#############################
#
# Heater and Fan
#
#############################
[heater_fan heatbreak_fan]
pin: PA12 #Out9
heater: extruder
heater_temp: 50.0

[heater_bed]
heater_pin: PA24 #Out1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: vref_scaled:PC15 #Temp0
#control: pid
pullup_resistor: 2200
#pid_Kp: 61.049
#pid_Ki: 2.339
#pid_Kd: 398.344
min_temp: 0
max_temp: 130

[fan]
pin: PC8 #Out8

#############################
#
# Probe
#
#############################
[probe]
pin: PD30 #IO04_in
x_offset: 31.8
y_offset: 5.5
#z_offset: 1.81
speed: 20.0
samples: 3 # Sampling, primarily for bed mesh. 3 is fine for normal PINDA probes.
samples_result: average
sample_retract_dist: 1.0

[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    G0 Z5 F1000
    G28 X0 Y0
    G4 P1000
    G0 X93.2 Y105 F20000
    G28 Z0
    G0 Z5 F1000

[z_tilt]
z_positions:
    0, 105
    191.2, 105
points:
    0, 105
    191.2, 105

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 31.8, 8.5
mesh_max: 223, 207
probe_count: 3, 3
adaptive_margin: 0

