# This file contains common pin mappings for the Duet3 Mini 5+. To use
# this config, the firmware should be compiled for the SAME54P20 with
# a "25Mhz crystal", "16KiB bootloader", and USB communication.

# To flash the board, double tap the board's reset button to enter the
# bootloader and then run: make flash FLASH_DEVICE=/dev/ttyACM0

# See docs/Config_Reference.md for a description of parameters.


# Pins for reference:
# Driver Step Pins - 0:PC26, 1:PC25, 2:PC24, 3:PC19, 4:PC16, 5:PC30, 6:PC18
# Driver Dir pins - 0:PB3, 1:PB29, 2:PB28, 3:PD20, 4:PD21, 5:PB0, 6:PA27
# Driver Enable - !PC28
# Uart addresses - 0:0 1:1 2:2 3:3 4:!0 5:!1 6:!2 | "!" is for inverted select pin
# Thermistor Pins - T0:PC0, T1:PC1, T2:PC2
# Vssa Sense:PB4 | Vref Sense:PB5
# Current Sense resistor for drivers - .076ohm
# SPI lines:{PD11, PC7} -> Shared SerCom#7, SPIMosi:PC12, SPIMiso:PC15, SPISCLK:PC13
# Vin Monitor:PC3, uses 11:1 voltage divider
# LED's - Diag:PA31, Act:PA30
# 12864 LCD - LCDCSPIN:PC6, ENCA:PC11, ENCB:PD1, ENCSW:PB9, LCD A0:PA2, LCDBeep:PA9, LCD Neopixel Out:PB12 (shared with IO3.out)
# Neopixel Out - PA8
# Serial0 - TX:PB25, RX:PB24 (USB)
# Serial1 - TX:PB31, RX:PB30
# SBC SPISS pin:PA6, SBCTfrReady:PA3, SerComPins:{PA4, PA5, PA6, PA7}
# CAN Pins - TX:PB14 RX:PB15
# Heaters, Fan outputs - {Out0:PB17 Out1:PC10 Out2:PB13 Out3:PB11 Out4:PA11, Out5:PB2, Out6:PB1} | Out6 is shared with VFD_Out
# Tach Pins for Fans - {Out3.Tach:PB27 Out4.Tach:PB26}
# GPIO_out - {IO1:PB31 IO2:PD9 IO3:PB12 IO4:PD10} IO4 is shared with PSON
# GPIO_in - {IO1:PB30 IO2:PD8 IO3:PB7 IO4:PC5 IO5:PC4 IO6:PC31}
# Driver Diag - {D0:PA10, D1:PB8, D2:PA22, D3:PA23, D4:PC21, D5:PB10, D6:PA27}
# Mux Pin - PD0
# EXP headers only support 12864 LCD's
[include mainsail.cfg]
[include exclude_object.cfg]
[include start_stop.cfg]
[include macro.cfg]
[include speed.cfg]
[include KAMP_Settings.cfg]
[display_status]
[exclude_object]
[virtual_sdcard]
path: ~/printer_data/gcodes
[pause_resume]
recover_velocity: 350

#############################
#
# Parrot 3D
#
#############################
[mcu]
serial: /dev/serial/by-id/usb-Klipper_same54p20a_B302606C484633532020204E421B18FF-if00

[mcu rpi]
serial: /tmp/klipper_host_mcu

[temperature_sensor raspberry_pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor duet3_m6hc]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    100, 100, 20  # an example

[printer]
kinematics: cartesian
max_velocity: 2500
max_accel: 8000
max_z_velocity: 20
max_z_accel: 1500

#############################
#
# Stepper
#
#############################

# [autotune_tmc stepper_x]
# motor: ldo-42sth40-1004a
# sg4_thrs: 150
# [autotune_tmc stepper_y]
# motor: ldo-42sth40-1004a
# sg4_thrs: 145

# [autotune_tmc stepper_z]
# motor: ldo-42sth34-1004l321e
# [autotune_tmc stepper_z1]
# motor: ldo-42sth34-1004l321e

# [autotune_tmc extruder]
# motor: bondtech-42H025H-0704A-005

[stepper_x]
#driver0
step_pin: PC26
dir_pin: !PB3
enable_pin: !PC28
microsteps: 128
rotation_distance: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 255
homing_speed: 70
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 0
diag_pin: PA10
interpolate: false
run_current: 0.50
sense_resistor: 0.056
# stealthchop_threshold: 999999
stealthchop_threshold: 1
# 255 is most sensitive value, 0 is least sensitive
driver_SGTHRS: 145

[stepper_y]
#driver1
step_pin: PC25
dir_pin: !PB29
enable_pin: !PC28
microsteps: 128
rotation_distance: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: -4
position_max: 212.5
position_min: -4
homing_speed: 70
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 1
diag_pin: PB8
interpolate: false
run_current: 0.50
sense_resistor: 0.056
# stealthchop_threshold: 999999
stealthchop_threshold: 1
# 255 is most sensitive value, 0 is least sensitive
driver_SGTHRS: 165

[stepper_z]
#driver2 R
step_pin: PC24
dir_pin: PB28
enable_pin: !PC28
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 235
homing_speed: 10

[tmc2209 stepper_z]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 2
interpolate: false
run_current: 0.4
sense_resistor: 0.056
stealthchop_threshold: 999999
# stealthchop_threshold: 1

[stepper_z1]
#driver 3 L
step_pin: PC19
dir_pin: PD20
enable_pin: !PC28
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop

[tmc2209 stepper_z1]
uart_pin: PA1
tx_pin: PA0
select_pins: PD0
uart_address: 3
interpolate: false
run_current: 0.4
sense_resistor: 0.056
stealthchop_threshold: 999999
# stealthchop_threshold: 1

[adc_scaled vref_scaled]
vref_pin: PB5
vssa_pin: PB4

#############################
#
# Extruder
#
#############################
[extruder]
#driver 4
step_pin: PC16
dir_pin: PD21
enable_pin: !PC28
microsteps: 128
rotation_distance: 8
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC10 #Out1
sensor_type: ATC Semitec 104GT-2
pullup_resistor: 2200
sensor_pin: vref_scaled:PC1 #Temp1
#control: pid
#pid_Kp: 30.089
#pid_Ki: 2.229
#pid_Kd: 101.550
min_temp: 0
max_temp: 300
# max_extrude_only_distance: 1000.0
# max_extrude_cross_section: 500
# max_extrude_only_velocity: 200
# max_extrude_only_accel: 10000
pressure_advance: 0.05
# pressure_advance_smooth_time: 0.040000

[tmc2209 extruder]
uart_pin: PA1
tx_pin: PA0
select_pins: !PD0
uart_address: 0
interpolate: false
run_current: 0.5
sense_resistor: 0.056
# stealthchop_threshold: 999999
stealthchop_threshold: 1

[verify_heater extruder]
max_error: 480

# Support for gcode arc (G2/G3) commands.
[gcode_arcs]
#resolution: 1.0
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.


#############################
#
# Heater and Fan
#
#############################
[heater_fan heatbreak_fan]
pin: PB1 #Out6
heater: extruder
heater_temp: 50.0

[heater_bed]
heater_pin: PB13 #Out2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: vref_scaled:PC0 #Temp0
#control: pid
pullup_resistor: 2200
#pid_Kp: 61.049
#pid_Ki: 2.339
#pid_Kd: 398.344
min_temp: 0
max_temp: 130

[fan]
pin: PB2 #Out5

#############################
#
# Probe
#
#############################
[probe]
pin: PB30 #IO01_in
x_offset: 31.8
y_offset: 5.5
#z_offset: 1.81
speed: 20.0
samples: 3 # Sampling, primarily for bed mesh. 3 is fine for normal PINDA probes.
samples_result: average
sample_retract_dist: 1.0

[homing_override]
axes: z
set_position_z: 0
gcode:
    G90
    G0 Z5 F1000
    G28 X0 Y0
    G4 P1000
    G0 X93.2 Y105 F20000
    G28 Z0
    G0 Z5 F1000

[z_tilt]
z_positions:
    191.2, 105
    5, 105
points:
    191.2, 105
    5, 105

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 33.0, 8.5
mesh_max: 223, 207
probe_count: 3, 3
adaptive_margin: 0

